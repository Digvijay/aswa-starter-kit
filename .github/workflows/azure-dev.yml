# Deploys the Static Web App + Function App to Azure via azd, using
# OIDC-federated User Managed Identity (no secrets). Generated by
# `azd pipeline config` and tweaked for the polyglot backend.
name: Deploy via azd

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Secretless Azure federated credentials.
# https://learn.microsoft.com/azure/developer/github/connect-from-azure
permissions:
  id-token: write
  contents: read

# Serialize deploys to the same environment so two pushes don't race
# the Function App package upload.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      STATIC_WEB_APP_SKU: ${{ vars.STATIC_WEB_APP_SKU }}
      STATIC_WEB_APP_LOCATION: ${{ vars.STATIC_WEB_APP_LOCATION }}
      # node | python | dotnet — picks the backend that gets built and shipped
      BACKEND_LANGUAGE: ${{ vars.BACKEND_LANGUAGE || 'node' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The build hook needs the toolchain matching BACKEND_LANGUAGE.
      # Node is always installed so the Static Web Apps SDK can run.
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python 3.11
        if: env.BACKEND_LANGUAGE == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup .NET 10
        if: env.BACKEND_LANGUAGE == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Cache azd state
        uses: actions/cache@v4
        with:
          path: |
            ~/.azd
            ~/.azure
          key: azd-${{ runner.os }}-${{ hashFiles('azure.yaml', 'infra/**') }}
          restore-keys: azd-${{ runner.os }}-

      - name: Log in with Azure (Federated Credentials)
        shell: pwsh
        run: |
          azd auth login `
            --client-id "$Env:AZURE_CLIENT_ID" `
            --federated-credential-provider "github" `
            --tenant-id "$Env:AZURE_TENANT_ID"

      - name: Provision infrastructure
        run: azd provision --no-prompt

      - name: Deploy application
        # `azd deploy` deploys the Static Web App; the `postdeploy` hook
        # in azure.yaml then builds and uploads the Function App.
        run: azd deploy --no-prompt

      - name: Smoke test live site
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          get() { azd env get-value "$1" 2>/dev/null | tr -d '[:space:]' || true; }
          url=$(get SERVICE_WEB_URI)
          if [ -z "$url" ]; then
            echo "::warning::no service URL exposed by azd; skipping smoke test"
            exit 0
          fi
          echo "Probing $url"
          for i in 1 2 3 4 5; do
            code=$(curl -fsSL -o /tmp/index.html -w '%{http_code}' "$url" || echo "000")
            if [ "$code" = "200" ] && grep -q '<title>' /tmp/index.html; then
              echo "Frontend OK ($code)"
              break
            fi
            echo "frontend attempt $i: HTTP $code, retrying in 5s"
            sleep 5
          done
          echo "Probing $url/api/status"
          for i in 1 2 3 4 5; do
            code=$(curl -fsSL -o /tmp/status.json -w '%{http_code}' "$url/api/status" || echo "000")
            if [ "$code" = "200" ] && grep -q '"runtime"' /tmp/status.json; then
              echo "API OK ($code): $(cat /tmp/status.json)"
              exit 0
            fi
            echo "api attempt $i: HTTP $code, retrying in 10s"
            sleep 10
          done
          echo "::warning::smoke test could not reach $url/api/status after 5 attempts (deploy itself succeeded)"
          exit 0
